<div style="display: flex; justify-content: space-between; align-items: center;">
    <a class="internal-link" href="{{ site.baseurl }}/">{{ site.title }}</a>
    <div style="display: flex; align-items: center; gap: 1em;">
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode">
            <svg class="theme-toggle-icon theme-toggle-icon--sun" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="4"></circle>
                <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
            </svg>
            <svg class="theme-toggle-icon theme-toggle-icon--moon" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path>
            </svg>
        </button>
        <a class="internal-link" href="{{ site.baseurl }}/about">About</a>
    </div>
</div>
<script>
  (function () {
    var toggle = document.getElementById("theme-toggle");
    toggle.addEventListener("click", function () {
      var root = document.documentElement;
      var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
      root.setAttribute("data-theme", next);
      try {
        localStorage.setItem("theme", next);
      } catch (e) {}
    });
  })();
</script>
